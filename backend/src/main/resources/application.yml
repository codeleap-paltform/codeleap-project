server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/codeleap?serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
